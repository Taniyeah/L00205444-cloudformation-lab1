AWSTemplateFormatVersion: '2010-09-09'
Description: L00205444 Taniya Offergeld - Lab 1b three tier architecture (network, security groups and the three tiers)

# Based on: Sofowoke, N. (2024) Building and Deploying a 3-tier
# Architecture with AWS CloudFormation. Medium.
#
# What I changed from the blog:
# - I left out the NAT gateway, so the private subnets have no route to
#   the internet
# - I take the availability zones from the region instead of fixing them
#   to us-east-1, because I work in eu-west-1
# - I left out the bastion host and its security group, so the app
#   security group has no SSH rule
# - web tier: one web server instead of the blog's auto scaling group and
#   load balancer, to keep it simple
# - I use a current Amazon Linux 2023 image for eu-west-1, because the
#   blog's image only exists in us-east-1, and dnf instead of
#   amazon-linux-extras
# - the page shows my L-number and name
# - t3.micro instead of t2.micro, because t2.micro is not free tier
#   eligible on my account
# - app tier: one plain server in a private subnet instead of the blog's
#   second auto scaling group, because there is no NAT gateway to install
#   software
# - database: a smaller instance size (db.t3.micro instead of
#   db.m6gd.large), a VPC security group instead of the old DB security
#   group and the MySQL 8.0 default minor version
# - the database password is a parameter with a throwaway default, so I do
#   not have to type it. This is a weakness, because the password is in the
#   repo. 
#
# The security group rules are the same as in the blog. Ports 22 and 3306
# on the web group are open to the internet, which is a weakness. 
#

Parameters:
  # Latest Amazon Linux 2023 image for this region, read from AWS
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

  # Database login. This is a throwaway password for this lab database only.
  # It is in the repo on purpose, so the stack deploys without a prompt. I
  # delete the database after testing and I do not use this password anywhere
  # else.
  MasterUsername:
    Type: String
    Default: admin

  MasterUserPassword:
    Type: String
    NoEcho: true
    Default: 4Wt6zR2emdXarHtd

Resources:

  # The private network for all three tiers
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.10.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true

  # Web tier subnets: public, in two availability zones
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.10.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.10.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true

  # Application tier subnets: private
  AppSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.10.3.0/24
      AvailabilityZone: !Select [0, !GetAZs '']

  AppSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.10.4.0/24
      AvailabilityZone: !Select [1, !GetAZs '']

  # Database tier subnets: private (RDS needs two availability zones)
  DbSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.10.5.0/24
      AvailabilityZone: !Select [0, !GetAZs '']

  DbSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.10.6.0/24
      AvailabilityZone: !Select [1, !GetAZs '']

  # The door to the internet for the public subnets
  InternetGateway:
    Type: AWS::EC2::InternetGateway

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # Public route table: all outside traffic goes to the internet gateway
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  # Private route table: no route to the internet (no NAT gateway)
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  AppSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref AppSubnet1
      RouteTableId: !Ref PrivateRouteTable

  AppSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref AppSubnet2
      RouteTableId: !Ref PrivateRouteTable

  DbSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DbSubnet1
      RouteTableId: !Ref PrivateRouteTable

  DbSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DbSubnet2
      RouteTableId: !Ref PrivateRouteTable

  # Security group for the web tier (same rules as the blog)
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Web tier security group
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          CidrIp: 0.0.0.0/0
        - IpProtocol: icmp
          FromPort: -1
          ToPort: -1
          CidrIp: 10.10.0.0/16

  # Security group for the app tier (same as the blog, without the
  # bastion SSH rule)
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: App tier security group
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  # Security group for the database tier: MySQL from the web group (same
  # as the blog)
  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Database tier security group
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref WebSecurityGroup

  # Web tier: one web server in a public subnet, with the web security group
  WebServer:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: t3.micro
      SubnetId: !Ref PublicSubnet1
      SecurityGroupIds:
        - !Ref WebSecurityGroup
      # Start up script: install Apache and write the page
      UserData: !Base64 |
        #!/bin/bash
        dnf install -y httpd
        echo "<h1>L00205444 - Taniya Offergeld</h1><p>Web tier</p>" > /var/www/html/index.html
        systemctl enable --now httpd

  # App tier: one plain server in a private subnet, with the app security group
  AppServer:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: t3.micro
      SubnetId: !Ref AppSubnet1
      SecurityGroupIds:
        - !Ref AppSecurityGroup

  # Database tier: the database lives in the two database subnets
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Database subnets
      SubnetIds:
        - !Ref DbSubnet1
        - !Ref DbSubnet2

  Database:
    Type: AWS::RDS::DBInstance
    Properties:
      Engine: mysql
      EngineVersion: '8.0'
      DBInstanceClass: db.t3.micro
      AllocatedStorage: 20
      MasterUsername: !Ref MasterUsername
      MasterUserPassword: !Ref MasterUserPassword
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups:
        - !Ref DbSecurityGroup
      MultiAZ: false

Outputs:
  WebsiteURL:
    Description: Address of the web tier
    Value: !Sub http://${WebServer.PublicDnsName}
  VpcId:
    Description: ID of the VPC
    Value: !Ref VPC
  DatabaseEndpoint:
    Description: Address of the database
    Value: !GetAtt Database.Endpoint.Address
  AppServerPrivateIp:
    Description: Private address of the app server
    Value: !GetAtt AppServer.PrivateIp
